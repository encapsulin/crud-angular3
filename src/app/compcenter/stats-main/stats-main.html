<div class="card">
  <div class="card-header">
    <b>Stats</b>
  </div>
  <div class="card-body">
    <table width="100%">
      @for (group of groups(); track group.id) {
        <tr>
          <td>
            <div align="right">{{ group.name }}</div>
          </td>
          <td width="100%">
            <div class="bar" [style.width.%]="group.width">
              <span>&nbsp;</span>
            </div>
          </td>
        </tr>
      } @empty {
        <div>Loading...</div>
      }
    </table>
  </div>
</div>
