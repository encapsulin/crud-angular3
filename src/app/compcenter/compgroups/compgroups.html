<div class="card">

    <div class="card-body">
        
        <ul>
            @for (group of groups(); track group.id) {
            <li 
            (click)="handleClick(group.id)"
            class="card-hover"
            [class.active-card]="group.id === activeGroupId()"
            >{{ group.name }} </li>
            } @empty {
            <li>Loading...</li>
            }
        </ul>
    </div>
</div>
