<div class="card">
  <div class="card-header">
    <b>Stats</b>
  </div>
  <div class="card-body">
    @for (group of groups(); track group.id) {
      <div class="mb-2">
        <div class="bar" [style.width.%]="group.value">
          <span>{{ group.name }}</span>
          <span>{{ group.value }}</span>
        </div>
      </div>
    } @empty {
      <div>Loading...</div>
    }
  </div>
</div>
