<div class="card">
  <div class="card-header">
    <b>Stats</b>
  </div>
  <div class="card-body">
    <table width="100%">
      @for (group of groups(); track group.id) {
        <tr>
          <td style="vertical-align: middle">
            <div align="right" style="white-space: nowrap">{{ group.name }}</div>
          </td>
          <td width="100%" style="vertical-align: middle">
            <div class="bar" [style.width.%]="group.width"></div>
          </td>
        </tr>
      } @empty {
        <div>Loading...</div>
      }
    </table>
  </div>
</div>
